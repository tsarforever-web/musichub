<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer"><!-- Яндекс Диск не отдаёт файлы, если браузер сообщает адрес чужого сайта -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MusicHub">
<meta name="theme-color" content="#0f0f12">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>MusicHub</title>
<style>
:root{
  --bg:#0f0f12; --panel:#16161b; --panel2:#1d1d24; --line:#2a2a33;
  --text:#f2f2f5; --muted:#9a9aa8; --dim:#6b6b78;
  --accent:#D7141E; --accent2:#f0333c; --ok:#3ecf8e; --warn:#f5a623;
  --r:12px; --player:88px; --side:232px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--accent)}
a{color:var(--accent2)}
.app{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:1fr var(--player);height:100vh;height:100dvh}

/* ---------- боковая панель ---------- */
.side{grid-row:1;background:#0b0b0e;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:.2px;padding:0 10px 18px}
.logo i{width:30px;height:30px;border-radius:8px;background:#231F20;border:1px solid #3a3436;display:grid;place-items:center}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text)}
.nav svg{width:20px;height:20px;flex:none}
.badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.side h6{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:18px 12px 6px;font-weight:600}
.pl-link{padding:7px 12px;border-radius:8px;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.pl-link:hover,.pl-link.on{color:var(--text);background:var(--panel)}

/* ---------- основная область ---------- */
.main{grid-row:1;overflow:auto;padding:28px 32px 40px;min-width:0}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head h1{font-size:30px;font-weight:750;letter-spacing:-.3px}
.head .sub{color:var(--muted);font-size:14px;margin-top:2px}
.head .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#3a3a46}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn svg{width:16px;height:16px}
.filter{max-width:320px}

/* список треков */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 44px minmax(0,1fr) minmax(0,.7fr) 56px 36px;align-items:center;gap:14px;padding:7px 10px;border-radius:10px;cursor:default}
.row:hover{background:var(--panel)}
.row.playing .t-title{color:var(--accent2)}
.row .num{color:var(--dim);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.row:hover .num{visibility:hidden}
.row .num-wrap{position:relative}
.row .play-mini{position:absolute;inset:0;display:none;place-items:center}
.row:hover .play-mini{display:grid}
.cov{width:44px;height:44px;border-radius:7px;overflow:hidden;background:var(--panel2);position:relative;flex:none}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cov .ph{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px}
.t-title{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-artist{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-album{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-dur{color:var(--dim);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.more{opacity:0;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.row:hover .more{opacity:1}
.more:hover{background:var(--panel2);color:var(--text)}
.list-head{display:grid;grid-template-columns:28px 44px minmax(0,1fr) minmax(0,.7fr) 56px 36px;gap:14px;padding:0 10px 8px;border-bottom:1px solid var(--line);margin-bottom:6px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em}

/* сетка исполнителей */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px}
.card{text-align:left;padding:12px;border-radius:14px}
.card:hover{background:var(--panel)}
.card .big{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--panel2);position:relative;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card.sq .big{border-radius:10px}
.card .big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .big .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;font-weight:750;color:#fff}
.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--muted);font-size:13px}

/* поиск */
.searchbar{position:relative;max-width:640px;margin-bottom:22px}
.searchbar input{padding:14px 16px 14px 46px;font-size:16px;border-radius:999px;background:var(--panel)}
.searchbar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.sec{margin:26px 0 10px;font-size:18px;font-weight:700}
.hint{color:var(--muted);font-size:14px}
.res{display:grid;grid-template-columns:52px minmax(0,1fr) 56px auto;gap:14px;align-items:center;padding:8px 10px;border-radius:10px}
.res:hover{background:var(--panel)}
.res .cov{width:52px;height:52px}
.dl{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.dl:hover{border-color:var(--accent);color:var(--accent2)}
.dl.have{border-color:transparent;color:var(--ok)}
.dl.busy{color:var(--warn);border-color:transparent}
.urlbox{display:flex;gap:10px;max-width:640px;margin-top:8px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);font-size:20px;margin-bottom:8px}

/* радио */
.rtabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--text);color:#000;border-color:var(--text)}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.st{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid transparent;text-align:left;min-width:0}
.st:hover{border-color:var(--line)}
.st.playing{border-color:var(--accent)}
.st .cov{width:52px;height:52px;border-radius:10px;background:#fff}
.st .cov img{object-fit:contain;background:#fff}
.st .info{flex:1;min-width:0}
.st .star{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--dim);font-size:19px;flex:none}
.st .star:hover{background:var(--panel2)}
.st .star.on{color:#f5c518}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--accent2);font-weight:700;font-size:12px;letter-spacing:.06em}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent2);animation:pulse 1s infinite alternate}

/* загрузки */
.job{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--panel);margin-bottom:8px}
.job .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--dim)}
.job.running .dot{background:var(--warn);animation:pulse 1s infinite alternate}
.job.done .dot{background:var(--ok)}
.job.failed .dot{background:var(--accent)}
.job b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job span{color:var(--muted);font-size:13px;word-break:break-word}
@keyframes pulse{to{opacity:.3}}

/* настройки */
.form{max-width:640px;display:flex;flex-direction:column;gap:18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px}
.box h3{font-size:16px}
.box p{color:var(--muted);font-size:13.5px}
.box label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.botrow{display:grid;grid-template-columns:1fr 150px 40px;gap:8px;align-items:center}
.status{font-size:13px;font-weight:600}
.status.ok{color:var(--ok)} .status.bad{color:var(--accent2)} .status.wait{color:var(--warn)}
.steps{color:var(--muted);font-size:13.5px;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.check{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--text)!important;font-size:14px!important}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- плеер ---------- */
.player{grid-column:1/-1;grid-row:2;background:#0b0b0e;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;padding:0 18px;gap:18px}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.now .cov{width:56px;height:56px;border-radius:8px}
.now .meta{min-width:0}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:6px}
.ctrl .btns{display:flex;align-items:center;gap:18px}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.ib:hover{color:var(--text)}
.ib.on{color:var(--accent2)}
.ib svg{width:20px;height:20px}
.pp{width:42px;height:42px;border-radius:50%;background:var(--text);color:#000;display:grid;place-items:center}
.pp:hover{transform:scale(1.05)}
.pp svg{width:20px;height:20px}
.bar{display:flex;align-items:center;gap:10px;width:100%;max-width:620px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;height:16px;flex:1;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--text) var(--p,0%),#3a3a44 var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px;opacity:0}
input[type=range]:hover::-webkit-slider-thumb{opacity:1}
input[type=range]:hover::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--accent2) var(--p,0%),#3a3a44 var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:#3a3a44}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--text)}
.vol{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.vol input{max-width:120px}

.toast{position:fixed;left:50%;bottom:calc(var(--player) + 20px);transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%)}
.menu{position:fixed;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px;z-index:40;min-width:200px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:7px;font-size:14px}
.menu button:hover{background:var(--panel)}
.menu .danger{color:var(--accent2)}
.tabs{display:none}

/* ---------- телефон ---------- */
@media (max-width:760px){
  :root{--player:64px}
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto auto}
  .side{display:none}
  .main{padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 24px}
  .head h1{font-size:26px}
  .row,.list-head{grid-template-columns:44px minmax(0,1fr) 36px}
  .row .num-wrap,.row .t-album,.row .t-dur,.list-head{display:none}
  .row .more{opacity:1}
  .res{grid-template-columns:48px minmax(0,1fr) auto}
  .res .t-dur{display:none}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .player{grid-row:2;grid-template-columns:minmax(0,1fr) auto;padding:6px 10px;gap:8px;height:var(--player);border-top:1px solid var(--line);position:relative}
  .now .cov{width:44px;height:44px}
  .ctrl{flex-direction:row}
  .ctrl .bar,.vol,#bShuffle,#bRepeat,#bPrev{display:none}
  .ctrl .btns{gap:6px}
  .mprog{position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--accent);width:var(--p,0%)}
  .tabs{grid-row:3;display:grid;grid-template-columns:repeat(5,1fr);background:#0b0b0e;border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;font-size:10.5px;color:var(--dim);position:relative}
  .tabs button.on{color:var(--text)}
  .tabs svg{width:22px;height:22px}
  .tabs .badge{position:absolute;top:3px;left:55%;margin:0}
  .two{grid-template-columns:1fr}
  .botrow{grid-template-columns:1fr 110px 36px}
  .toast{bottom:calc(var(--player) + 80px)}
}
@media (min-width:761px){.mprog,.mob-only{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><i><svg width="14" height="12" viewBox="0 0 14 12"><path d="M0 0h14L7 12z" fill="#D7141E"/></svg></i>MusicHub</div>
    <button class="nav" data-view="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Все треки</button>
    <button class="nav" data-view="artists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke-linecap="round"/></svg>Исполнители</button>
    <button class="nav" data-view="playlists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h12M4 12h12M4 18h7M17 18V9l4-1"/><circle cx="15" cy="18" r="2"/></svg>Плейлисты</button>
    <button class="nav" data-view="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Поиск и скачивание<span class="badge" id="jobBadge" hidden>0</span></button>
    <button class="nav" data-view="chart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Чарт</button>
    <button class="nav" data-view="radio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>Радио</button>
    <button class="nav" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke-linecap="round"/></svg>Подключение</button>
  </aside>

  <main class="main" id="main"></main>

  <footer class="player">
    <div class="mprog" id="mprog"></div>
    <div class="now" id="now">
      <div class="cov" id="nowCov"></div>
      <div class="meta"><div class="t-title" id="nowTitle">Ничего не играет</div><div class="t-artist" id="nowArtist">Выберите трек</div></div>
    </div>
    <div class="ctrl">
      <div class="btns">
        <button class="ib" id="bShuffle" title="Перемешать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="ib" id="bPrev" title="Назад"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="pp" id="bPlay" title="Играть"><svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button>
        <button class="ib" id="bNext" title="Вперёд"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button class="ib" id="bRepeat" title="Повтор"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      </div>
      <div class="bar"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="tDur">0:00</span></div>
    </div>
    <div class="vol">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9aa8" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="#9a9aa8"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      <input type="range" id="vol" min="0" max="100" value="90">
    </div>
  </footer>

  <nav class="tabs" id="tabs">
    <button data-view="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Треки</button>
    <button data-view="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Поиск<span class="badge" id="jobBadge2" hidden>0</span></button>
    <button data-view="chart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Чарт</button>
    <button data-view="radio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>Радио</button>
    <button data-view="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>Ещё</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<div class="np" id="np" hidden>
  <div class="np-bg" id="npBg"></div>
  <div class="np-sheet" id="npSheet">
    <div class="np-top"><button class="ib np-x" id="npClose" aria-label="Свернуть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="np-ctx" id="npCtx"></div><span class="np-x"></span></div>
    <div class="np-art" id="npArt"></div>
    <div class="np-meta"><div style="min-width:0;flex:1"><div class="np-title" id="npTitle"></div><button class="np-artist" id="npArtist"></button></div>

<script>
{ // block: всё в отдельной области видимости, чтобы плеер мог обновить сам себя

/* MusicHub Web — плеер, который берёт музыку прямо с Яндекс Диска (Mac не нужен). */
const API = "https://cloud-api.yandex.net/v1/disk";
const POLYGON = "https://yandex.ru/dev/disk/poligon/";
const OAUTH_CLIENT_ID = "";   // можно вписать ID своего приложения Яндекс OAuth — появится кнопка «Войти через Яндекс»

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => { s = Math.max(0, Math.round(s||0)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
const norm = s => String(s||"").toLowerCase().replace(/ё/g,"е");
const hue = s => { let h=0; for (const c of String(s)) h=(h*31+c.charCodeAt(0))%360; return h; };
const ph = name => `<div class="ph" style="background:linear-gradient(135deg,hsl(${hue(name)} 55% 38%),hsl(${(hue(name)+40)%360} 60% 22%))">${esc((name||"?").trim()[0]||"?").toUpperCase()}</div>`;
const plural = (n,a,b,c) => { n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; };
const ls = { get:k=>{ try{return localStorage.getItem(k)}catch(e){return null} }, set:(k,v)=>{ try{localStorage.setItem(k,v)}catch(e){} }, del:k=>{ try{localStorage.removeItem(k)}catch(e){} } };
let toastT; const toast = msg => { const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3200); };

// ---------- Яндекс Диск ----------
const D = { token: ls.get("ydToken") || "", folder: ls.get("ydFolder") || "Музыка" };
(function readOAuthHash(){ const m = location.hash.match(/access_token=([^&]+)/); if (m) { D.token = decodeURIComponent(m[1]); ls.set("ydToken", D.token); history.replaceState(null, "", location.pathname); } })();
const diskPath = rel => `disk:/${D.folder.replace(/^\/+|\/+$/g,"")}/${rel}`;
async function yd(path, params={}){
  const u = new URL(API + path); Object.entries(params).forEach(([k,v]) => u.searchParams.set(k, v));
  const r = await fetch(u, {headers:{Authorization:"OAuth "+D.token}});
  if (r.status===401) throw Object.assign(new Error("Ключ доступа не подходит или устарел"), {auth:true});
  if (!r.ok) { let m=""; try { const j = await r.json(); m = j.message || j.description || ""; } catch(e){}
    throw Object.assign(new Error(`Яндекс Диск ${r.status}${m?": "+m:""}`), {status:r.status}); }
  return r.json();
}
const hrefCache = {};
async function downloadHref(rel){
  const c = hrefCache[rel]; if (c && Date.now()-c.t < 40*60e3) return c.href;
  const d = await yd("/resources/download", {path: diskPath(rel)});
  hrefCache[rel] = {href:d.href, t:Date.now()}; return d.href;
}

// ---------- состояние ----------
const S = { tracks:[], byId:{}, covers:{}, playlists:[], radioFavs:[], view:"library", arg:null, filter:"",
            queue:[], qi:-1, shuffle:false, repeat:0, mode:"track", loading:false, updated:0, source:"" };
const audio = $("#audio");

async function loadLibrary(force, quiet){
  if (!D.token) { go("settings"); return; }
  if (!quiet) { S.loading = true; render(); }
  try {
    let data = null;
    try {   // 1) каталог, который выкладывает MusicHub на Mac: теги, обложки, плейлисты
      const href = await downloadHref("_musichub/library.json");
      const r = await fetch(href, {referrerPolicy:"no-referrer"}); if (r.ok) data = await r.json();
    } catch(e) { if (e.auth) throw e; }
    if (data && data.tracks) {
      S.source = "catalog"; S.updated = data.updated;
      S.covers = data.covers || {}; S.playlists = data.playlists || []; S.radioFavs = data.radio || [];
      setTracks(data.tracks);
      try { ls.set("cache", JSON.stringify(data)); } catch(e){}
    } else {  // 2) запасной вариант — просто список аудиофайлов в папке
      S.source = "files"; S.covers = {}; S.playlists = [];
      const prefix = diskPath("").replace(/\/$/, "/");
      const all = []; let offset = 0;
      while (true) {
        const d = await yd("/resources/files", {media_type:"audio", limit:1000, offset, fields:"items.path,items.name"});
        const items = d.items || []; all.push(...items); if (items.length < 1000) break; offset += 1000;
      }
      setTracks(all.filter(i => i.path.startsWith(prefix)).map(i => fromPath(i.path.slice(prefix.length))));
    }
  } catch(e) {
    if (e.auth) { toast(e.message); D.token=""; ls.del("ydToken"); go("settings"); return; }
    const cached = ls.get("cache");
    if (cached) { const data = JSON.parse(cached); S.covers=data.covers||{}; S.playlists=data.playlists||[]; S.radioFavs=data.radio||[]; setTracks(data.tracks); toast("Нет связи с Диском — показываю сохранённый список"); }
    else toast("Не удалось загрузить библиотеку: "+e.message);
  }
  S.loading = false; render();
}
function fromPath(rel){
  const parts = rel.split("/"); const file = parts.pop().replace(/\.[^.]+$/, "");
  const artist = parts[0] || "Неизвестный исполнитель"; const album = parts[1] && parts[1]!=="Синглы" ? parts[1] : "";
  const m = file.match(/^(\d{1,3})\s+(.*)$/);
  return {path:rel, artist, album, title: m ? m[2] : file, track: m ? +m[1] : 0, duration:0, cover:""};
}
function setTracks(list){
  list.forEach(t => { t.id = t.path; t.artist = t.artist || "Неизвестный исполнитель"; });
  list.sort((a,b) => norm(a.artist).localeCompare(norm(b.artist),"ru") || norm(a.album).localeCompare(norm(b.album),"ru") || (a.track-b.track) || norm(a.title).localeCompare(norm(b.title),"ru"));
  S.tracks = list; S.byId = Object.fromEntries(list.map(t=>[t.id,t]));
}
const coverHtml = t => ph(t.artist) + (S.covers[t.cover] ? `<img src="${S.covers[t.cover]}">` : "");

// ---------- навигация и отрисовка ----------
function go(view, arg=null){ S.view=view; S.arg=arg; render(); $("#main").scrollTop=0; }
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
function trackRows(list){
  if (!list.length) return "";
  return `<div class="list-head"><span>#</span><span></span><span>Название</span><span>Альбом</span><span style="text-align:right">⏱</span><span></span></div>
  <div class="list">${list.map((t,i)=>`
    <div class="row ${S.mode==="track"&&S.queue[S.qi]===t.id?"playing":""}" data-i="${i}">
      <div class="num-wrap"><div class="num">${i+1}</div><button class="play-mini ib"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M7 4v16l13-8z"/></svg></button></div>
      <div class="cov">${coverHtml(t)}</div>
      <div style="min-width:0"><div class="t-title">${esc(t.title)}</div><div class="t-artist">${esc(t.artist)}</div></div>
      <div class="t-album">${esc(t.album)}</div><div class="t-dur">${t.duration?fmt(t.duration):""}</div><span></span>
    </div>`).join("")}</div>`;
}
function bindRows(list){ document.querySelectorAll(".row").forEach(r => { const i=+r.dataset.i; r.onclick = () => playList(list, i); }); }
function render(){
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view===S.view || ((S.view==="artist"||S.view==="artists")&&b.dataset.view==="artists") || (S.view==="playlist"&&b.dataset.view==="playlists") || (["more","playlists","playlist","artists","artist","settings"].includes(S.view)&&b.dataset.view==="more"&&!b.classList.contains("nav"))));
  const m = $("#main"), V = S.view;
  if (V!=="settings" && !D.token) { S.view="settings"; return render(); }
  if (S.loading && V!=="settings" && V!=="radio") { m.innerHTML = `<div class="empty"><h3>Загружаю библиотеку…</h3><p>Читаю папку «${esc(D.folder)}» на Яндекс Диске</p></div>`; return; }
  if (V==="library"){
    const f = norm(S.filter);
    const list = f ? S.tracks.filter(t => norm(t.title+" "+t.artist+" "+t.album).includes(f)) : S.tracks;
    m.innerHTML = `<div class="head"><div><h1>Все треки</h1><div class="sub">${S.tracks.length} ${plural(S.tracks.length,"трек","трека","треков")} на Яндекс Диске</div></div><div class="grow"></div>
      <input class="filter" id="filter" type="search" placeholder="Найти в библиотеке" value="${esc(S.filter)}">
      <button class="btn primary" id="shuffleAll">Перемешать</button><button class="btn mob-only" onclick="go('artists')">Исполнители</button><button class="btn" id="reload" title="Обновить">↻</button></div>
      ${S.tracks.length ? (trackRows(list) || `<div class="empty">Ничего не найдено</div>`) : `<div class="empty"><h3>Пока пусто</h3><p>В папке «${esc(D.folder)}» на Яндекс Диске не найдено музыки. Проверьте название папки в разделе «Подключение».</p></div>`}`;
    $("#filter").oninput = e => { S.filter = e.target.value; const pos=e.target.selectionStart; render(); const el=$("#filter"); el.focus(); el.setSelectionRange(pos,pos); };
    $("#shuffleAll").onclick = () => { if (!list.length) return; S.shuffle=true; $("#bShuffle").classList.add("on"); playList(list, Math.floor(Math.random()*list.length)); };
    $("#reload").onclick = () => loadLibrary(true);
    bindRows(list);
  } else if (V==="artists"){
    const by = {}; S.tracks.forEach(t => (by[t.artist] ||= []).push(t));
    const names = Object.keys(by).sort((a,b)=>norm(a).localeCompare(norm(b),"ru"));
    m.innerHTML = `<div class="head"><div><h1>Исполнители</h1><div class="sub">${names.length}</div></div></div>
      <div class="grid">${names.map(n=>{ const c = by[n].find(t=>S.covers[t.cover]); return `<button class="card" data-a="${esc(n)}"><div class="big">${ph(n)}${c?`<img src="${S.covers[c.cover]}">`:""}</div><b>${esc(n)}</b><span>${by[n].length} ${plural(by[n].length,"трек","трека","треков")}</span></button>`; }).join("")}</div>`;
    document.querySelectorAll(".card").forEach(c => c.onclick = () => go("artist", c.dataset.a));
  } else if (V==="artist"){
    const list = S.tracks.filter(t => t.artist===S.arg);
    m.innerHTML = `<div class="head"><button class="btn" onclick="go('artists')">←</button><div><h1>${esc(S.arg)}</h1><div class="sub">${list.length} ${plural(list.length,"трек","трека","треков")}</div></div><div class="grow"></div><button class="btn primary" id="playAll">▶ Слушать</button></div>${trackRows(list)}`;
    $("#playAll").onclick = () => playList(list, 0); bindRows(list);
  } else if (V==="playlists"){
    const allPl = likedPlaylist() ? [likedPlaylist(), ...S.playlists] : S.playlists;
    m.innerHTML = `<div class="head"><div><h1>Плейлисты</h1></div></div>
      ${allPl.length ? `<div class="grid">${allPl.map(p=>{ const t=S.byId[p.paths[0]]; return `<button class="card sq" data-p="${esc(p.name)}"><div class="big">${ph(p.name)}${t&&S.covers[t.cover]?`<img src="${S.covers[t.cover]}">`:""}</div><b>${esc(p.name)}</b><span>${p.paths.length} ${plural(p.paths.length,"трек","трека","треков")}</span></button>`; }).join("")}</div>`
        : `<div class="empty"><h3>Плейлистов нет</h3><p>${S.source==="files" ? "Плейлисты появятся, когда MusicHub на Mac выложит каталог библиотеки на Диск." : "Перенесите плейлист из Яндекс Музыки в MusicHub на Mac."}</p></div>`}`;
    document.querySelectorAll(".card").forEach(c => c.onclick = () => go("playlist", c.dataset.p));
  } else if (V==="playlist"){
    const p = (S.arg===LIKED ? likedPlaylist() : S.playlists.find(x=>x.name===S.arg)) || {paths:[]};
    const list = p.paths.map(id=>S.byId[id]).filter(Boolean);
    m.innerHTML = `<div class="head"><button class="btn" onclick="go('playlists')">←</button><div><h1>${esc(S.arg)}</h1><div class="sub">${list.length} ${plural(list.length,"трек","трека","треков")}</div></div><div class="grow"></div><button class="btn primary" id="playAll">▶ Слушать</button></div>${trackRows(list)}`;
    $("#playAll").onclick = () => list.length && playList(list, 0); bindRows(list);
  } else if (V==="radio") renderRadio();
  else if (V==="chart") renderChart();
  else if (V==="more") renderMore();
  else if (V==="search") renderSearch();
  else if (V==="settings") renderSettings();
}

// ---------- подключение ----------
function renderSettings(){
  $("#main").innerHTML = `<div class="head"><div><h1>Подключение</h1><div class="sub">Музыка играет прямо с вашего Яндекс Диска — Mac для этого не нужен</div></div></div>
  <div class="form">
    ${D.token ? `<div class="box"><h3>Яндекс Диск подключён <span class="status ok">●</span></h3>
        <p>Папка с музыкой: «${esc(D.folder)}». ${S.updated?`Каталог от MusicHub обновлён ${new Date(S.updated*1000).toLocaleString("ru")}.`:""}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="reload2">↻ Обновить библиотеку</button><button class="btn" id="logout">Отключить</button></div></div>`
    : `<div class="box"><h3>Подключить Яндекс Диск</h3>
        <p>Один раз нужно получить ключ доступа к Диску. Это займёт пару минут.</p>
        <ol class="steps">
          <li>Откройте <a href="https://oauth.yandex.ru/client/new" target="_blank" rel="noopener">oauth.yandex.ru</a> → «Создать приложение».</li>
          <li>Название — <b>MusicHub</b>. Платформа — <b>«Веб-сервисы»</b>, в поле Redirect URI вставьте:<br><code style="user-select:all;word-break:break-all;font-size:12px">https://oauth.yandex.ru/verification_code</code></li>
          <li>В доступах найдите Яндекс Диск и отметьте две галочки: <b>«Чтение всего Диска»</b> и <b>«Доступ к папке приложения на Диске»</b> (через неё телефон передаёт Mac заявки на скачивание). Сохраните приложение.</li>
          <li>Скопируйте <b>ClientID</b> приложения сюда и нажмите «Получить ключ»:</li>
        </ol>
        <div class="two"><label>ClientID<input id="cid" value="${esc(ls.get("ydClient")||OAUTH_CLIENT_ID)}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
          <div style="align-self:end"><button class="btn" id="getTok">Получить ключ</button></div></div>
        <p>Яндекс покажет страницу с ключом — скопируйте его и вставьте ниже.</p>

// ---------- радио (каталог radio-browser.info; в веб-версии только https-потоки) ----------
const R = { tab:"favs", list:[], q:"", loading:false, err:"", local: JSON.parse(ls.get("radioFavs")||"null") };
const radioFavs = () => R.local ?? S.radioFavs.filter(s => /^https:/i.test(s.url));
const isFav = st => radioFavs().some(f=>f.url===st.url);
async function radioFetch(q){
  R.loading = true; R.err=""; renderRadio();
  const hosts = ["de1","fi1","de2","nl1","at1"].sort(()=>Math.random()-.5);
  for (const h of hosts) {
    try {
      const u = new URL(`https://${h}.api.radio-browser.info/json/stations/search`);
      Object.entries({hidebroken:"true", order:"clickcount", reverse:"true", limit:"160", ...(q?{name:q}:{countrycode:"RU"})}).forEach(([k,v])=>u.searchParams.set(k,v));
      const d = await (await fetch(u)).json(); const seen = new Set();
      R.list = d.map(s => ({id:s.stationuuid, name:(s.name||"").trim(), url:s.url_resolved||s.url, favicon:s.favicon||"", tags:(s.tags||"").split(",").filter(Boolean).slice(0,3), bitrate:s.bitrate||0, hls:s.hls}))
        .filter(s => s.url && /^https:/i.test(s.url) && !s.hls && !/\.m3u8/.test(s.url) && !seen.has(s.name.toLowerCase()) && seen.add(s.name.toLowerCase())).slice(0,80);
      R.err = ""; break;
    } catch(e){ R.err = "каталог радио недоступен"; }
  }
  R.loading = false; if (S.view==="radio") renderRadio();
}
function renderRadio(){
  const list = R.tab==="favs" ? radioFavs() : R.list;
  const st = (s,i) => { const playing = S.mode==="radio" && S.station && S.station.url===s.url;
    return `<div class="st ${playing?"playing":""}" data-i="${i}"><div class="cov">${ph(s.name)}${s.favicon?`<img loading="lazy" src="${esc(s.favicon)}" onerror="this.remove()">`:""}</div>
      <div class="info"><div class="t-title">${esc(s.name)}</div><div class="t-artist">${playing?'<span class="live">В ЭФИРЕ</span> ':""}${esc([(s.tags||[]).join(", "), s.bitrate?s.bitrate+" kbps":""].filter(Boolean).join(" · "))}</div></div>
      <button class="star ${isFav(s)?"on":""}">${isFav(s)?"★":"☆"}</button></div>`; };
  $("#main").innerHTML = `<div class="head"><div><h1>Радио</h1><div class="sub">Онлайн-радиостанции</div></div></div>
    <div class="rtabs"><button class="chip ${R.tab==="favs"?"on":""}" data-t="favs">★ Избранное</button><button class="chip ${R.tab==="top"?"on":""}" data-t="top">Популярные в России</button><button class="chip ${R.tab==="find"?"on":""}" data-t="find">Поиск</button></div>
    ${R.tab==="find"?`<form class="searchbar" id="rform"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="rq" type="search" placeholder="Название станции" value="${esc(R.q)}"></form>`:""}
    ${R.loading ? `<p class="hint">Загружаю станции…</p>` : R.err && R.tab!=="favs" ? `<p class="hint">${esc(R.err)}</p>`
      : !list.length ? (R.tab==="favs" ? `<div class="empty"><h3>Избранных станций пока нет</h3><p>Откройте «Популярные» и нажмите ☆</p></div>` : (R.tab==="find"&&!R.q?"":`<p class="hint">Ничего не найдено</p>`))
      : `<div class="stations">${list.map(st).join("")}</div>`}`;
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { R.tab=c.dataset.t; if (R.tab==="top") radioFetch(""); else { if (R.tab==="find") R.list=[]; renderRadio(); } });
  if ($("#rform")) $("#rform").onsubmit = e => { e.preventDefault(); R.q=$("#rq").value.trim(); if (R.q) radioFetch(R.q); };
  document.querySelectorAll(".st").forEach(el => { const s = list[+el.dataset.i];
    el.onclick = e => { if (!e.target.closest(".star")) playStation(s, list); };
    el.querySelector(".star").onclick = e => { e.stopPropagation(); let f = radioFavs().slice();
      f = isFav(s) ? f.filter(x=>x.url!==s.url) : [...f, s]; R.local = f; ls.set("radioFavs", JSON.stringify(f)); renderRadio(); };
  });
}
function playStation(st, list){
  S.mode="radio"; S.station=st; S.stations=list.slice();
  audio.src = st.url; audio.play().catch(()=>toast("Станция не отвечает"));
  $("#nowTitle").textContent = st.name; $("#nowArtist").innerHTML = '<span class="live">В ЭФИРЕ</span>';
  $("#nowCov").innerHTML = ph(st.name) + (st.favicon?`<img src="${esc(st.favicon)}" onerror="this.remove()" style="object-fit:contain;background:#fff">`:"");

  updateNP(true);
}
function stepStation(d){ const L=S.stations||[]; if (!L.length) return; let i=L.findIndex(x=>x.url===S.station.url); playStation(L[(i+d+L.length)%L.length], L); }


// ---------- поиск и заявки на скачивание (выполняет MusicHub на Mac) ----------
const Q = { seenDone:new Set(), firstPoll:true, q:"", results:null, err:"", reqs: JSON.parse(ls.get("reqs")||"[]"), jobs:{}, jobsUpdated:0 };
function jsonp(url){ return new Promise((res, rej) => { const cb = "cb"+Math.random().toString(36).slice(2); const sc = document.createElement("script");
  const t = setTimeout(()=>{ cleanup(); rej(new Error("нет ответа")); }, 12000);
  function cleanup(){ clearTimeout(t); delete window[cb]; sc.remove(); }
  window[cb] = d => { cleanup(); res(d); }; sc.onerror = () => { cleanup(); rej(new Error("нет связи")); };
  sc.src = url + (url.includes("?")?"&":"?") + "callback=" + cb; document.head.appendChild(sc); }); }
async function catalogSearch(q){
  const d = await jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&entity=song&limit=25&country=ru&lang=ru_ru`);
  return (d.results||[]).map(r => ({artist:r.artistName, title:r.trackName, album:(r.collectionName||"").replace(/ - (Single|EP)$/,""), year:(r.releaseDate||"").slice(0,4),
    track:r.trackNumber||0, duration:Math.round((r.trackTimeMillis||0)/1000), cover:(r.artworkUrl100||"").replace("100x100","200x200"), cover_url:(r.artworkUrl100||"").replace("100x100","600x600"), preview:r.previewUrl||""}));
}
const inLib = r => S.tracks.some(t => norm(t.artist).includes(norm(r.artist).split(",")[0]) && norm(t.title)===norm(r.title));
async function sendRequest(body, label){
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const req = {id, ...body, created: Math.floor(Date.now()/1000)};
  try {
    const up = await yd("/resources/upload", {path:`app:/musichub-requests/${id}.json`, overwrite:"true"}).catch(async e => {
      if (String(e.message).includes("409")) { await ydPut("/resources", {path:"app:/musichub-requests"}); return yd("/resources/upload", {path:`app:/musichub-requests/${id}.json`, overwrite:"true"}); }
      throw e; });
    const r = await fetch(up.href, {method:"PUT", body:new Blob([JSON.stringify(req)], {type:"application/octet-stream"})});
    if (!r.ok && r.status!==201 && r.status!==202) throw new Error("загрузка "+r.status);
  } catch(e) {
    toast(e.auth || /403/.test(e.message) ? "Нет права записи: пересоздайте ключ с галочкой «Доступ к папке приложения»" : "Не удалось отправить заявку: "+e.message); return false;
  }
  Q.reqs.unshift({id, label, t:Date.now()}); Q.reqs = Q.reqs.slice(0,60); ls.set("reqs", JSON.stringify(Q.reqs));
  toast("Заявка отправлена — Mac скачает трек"); pollJobs(); return true;
}
async function ydPut(path, params){ const u = new URL(API+path); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r = await fetch(u, {method:"PUT", headers:{Authorization:"OAuth "+D.token}}); if (!r.ok && r.status!==409) throw new Error("Яндекс Диск: "+r.status); }
let jobsT = null;
async function pollJobs(){
  clearTimeout(jobsT); if (!D.token) return;
  try {
    const href = await downloadHref("_musichub/jobs.json"); delete hrefCache["_musichub/jobs.json"];
    const d = await (await fetch(href, {referrerPolicy:"no-referrer"})).json(); const before = JSON.stringify(Q.jobs);
    Q.jobs = Object.fromEntries((d.jobs||[]).filter(j=>j.rid).map(j=>[j.rid, j])); Q.jobsUpdated = d.updated||0;
    const doneNow = Object.values(Q.jobs).filter(j => j.status==="done" && !Q.seenDone.has(j.rid));
    doneNow.forEach(j => Q.seenDone.add(j.rid));
    if (doneNow.length && Q.firstPoll===false) loadLibrary(true, true);
    Q.firstPoll = false;
  } catch(e) {}
  const pending = Q.reqs.filter(r => !Q.jobs[r.id] || ["queued","running"].includes(Q.jobs[r.id].status));
  for (const b of [$("#jobBadge"),$("#jobBadge2")]) if (b) { b.hidden = !pending.length; b.textContent = pending.length; }
  if (S.view==="search") renderReqs();
  if (pending.length) jobsT = setTimeout(pollJobs, 15000);
}
function reqStatus(r){
  const j = Q.jobs[r.id];
  if (!j) return {cls:"", txt:"ждёт Mac — выполнится, когда Mac будет включён"};
  return {cls:j.status, txt:({queued:"в очереди на Mac", running:"скачивается", done:"готово", failed:"не найдено"}[j.status]||j.status) + (j.message?" · "+j.message:"")};
}
function renderReqs(){
  const el = $("#reqs"); if (!el) return;
  el.innerHTML = Q.reqs.length ? `<div class="sec">Мои заявки</div>` + Q.reqs.slice(0,20).map(r => { const s = reqStatus(r);
    return `<div class="job ${s.cls}"><div class="dot"></div><div style="min-width:0;flex:1"><b>${esc(r.label)}</b><span>${esc(s.txt)}</span></div></div>`; }).join("") : "";
}
function renderSearch(){
  const q = Q.q, isUrl = /^https?:\/\//i.test(q);
  const local = q && !isUrl ? S.tracks.filter(t => norm(t.title+" "+t.artist+" "+t.album).includes(norm(q))).slice(0,6) : [];
  $("#main").innerHTML = `<div class="head"><div><h1>Поиск</h1><div class="sub">Найдите трек или вставьте ссылку на плейлист Яндекс Музыки, YouTube, SoundCloud — MusicHub на Mac скачает его в библиотеку</div></div></div>
    <form class="searchbar" id="sform">${'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>'}
      <input id="sq" type="search" placeholder="Исполнитель, песня или ссылка" value="${esc(q)}" autocomplete="off" enterkeyhint="search"></form>
    ${isUrl ? `<div class="box"><h3>Скачать по ссылке</h3><p>${/music\.yandex\./.test(q)?"Плейлист Яндекс Музыки будет перенесён в библиотеку целиком.":"Будет скачано всё аудио по ссылке."}</p><div><button class="btn primary" id="dlUrl">Скачать в библиотеку</button></div></div>` : ""}
    ${local.length ? `<div class="sec">Уже есть в библиотеке</div>${trackRows(local)}` : ""}
    ${q && !isUrl ? `<div class="sec">Найдено</div><div id="online">${Q.results===null?`<p class="hint">Ищу…</p>`:onlineHtml()}</div>
       <p class="hint" style="margin-top:12px">Нет нужного варианта? <a href="#" id="dlQuery">Скачать по запросу «${esc(q)}»</a></p>` : ""}
    <div id="reqs"></div>`;
  $("#sform").onsubmit = e => { e.preventDefault(); doSearch($("#sq").value); };
  if ($("#dlUrl")) $("#dlUrl").onclick = () => sendRequest({kind:"url", url:q}, /music\.yandex\./.test(q) ? "Плейлист Яндекс Музыки" : q);
  if ($("#dlQuery")) $("#dlQuery").onclick = e => { e.preventDefault(); sendRequest({kind:"query", q}, q); };
  bindRows(local); bindOnline(); renderReqs();
}
function onlineHtml(){
  if (Q.err) return `<p class="hint">Поиск не удался: ${esc(Q.err)}. Можно скачать по запросу ниже.</p>`;
  if (!Q.results.length) return `<p class="hint">Ничего не нашлось. Попробуйте «Исполнитель - Название».</p>`;
  return Q.results.map((r,i) => { const sent = Q.reqs.some(x => x.label===`${r.artist} - ${r.title}`);
    const pl = S.mode==="preview" && S.pv && S.pv.preview===r.preview;
    return `<div class="res ${pl?"playing":""}" data-pv="${i}"><div class="cov">${ph(r.artist)}${r.cover?`<img loading="lazy" src="${esc(r.cover)}" onerror="this.remove()">`:""}${r.preview?'<span class="pvbadge">▶</span>':""}</div>
      <div style="min-width:0"><div class="t-title">${esc(r.title)}</div><div class="t-artist">${esc(r.artist)}${r.album?" · "+esc(r.album):""}</div></div>
      <div class="t-dur">${fmt(r.duration)}</div>
      ${inLib(r) ? `<button class="dl have" disabled>✓ Есть</button>` : sent ? `<button class="dl busy" disabled>Заявка</button>` : `<button class="dl" data-i="${i}">Скачать</button>`}</div>`; }).join("");
}
function bindOnline(){
  document.querySelectorAll(".res[data-pv]").forEach(el => el.onclick = e => { if (e.target.closest(".dl")) return; const r = Q.results[+el.dataset.pv];
    if (!r.preview) { toast("Для этого трека нет отрывка — можно скачать целиком"); return; } playPreview(r, Q.results.filter(x=>x.preview), "Поиск"); });
  document.querySelectorAll(".dl[data-i]").forEach(b => b.onclick = async () => { const r = Q.results[+b.dataset.i]; b.disabled = true; b.textContent = "…";
  const {cover, ...meta} = r; if (await sendRequest({kind:"track", meta}, `${r.artist} - ${r.title}`)) { $("#online").innerHTML = onlineHtml(); bindOnline(); } else { b.disabled=false; b.textContent="Скачать"; } }); }
async function doSearch(q){
  Q.q = q.trim(); Q.results = null; Q.err = ""; renderSearch();
  if (!Q.q || /^https?:\/\//i.test(Q.q)) return;
  try { Q.results = await catalogSearch(Q.q); } catch(e) { Q.err = e.message; Q.results = []; }
  if (S.view==="search" && $("#online")) { $("#online").innerHTML = onlineHtml(); bindOnline(); }
}

  document.querySelectorAll("[data-dl]").forEach(b => b.onclick = async e => { e.stopPropagation(); const t = list[+b.dataset.dl]; b.disabled = true; b.textContent="…";
    const meta = {artist:t.artist, title:t.title, album:t.album, year:t.year, track:t.track, duration:t.duration, cover_url:t.cover_url};
    if (await sendRequest({kind:"track", meta}, `${t.artist} - ${t.title}`)) renderChart(); else { b.disabled=false; b.textContent="Скачать"; } });
}
const chKey = t => norm(t.artist+"|"+t.title);
const pvCache = {};
async function findPreview(t){   // отрывок 30 сек из открытого каталога Apple
  const k = chKey(t); if (k in pvCache) return pvCache[k];
  try { const d = await jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent(t.artist.split(",")[0]+" "+t.title)}&media=music&entity=song&limit=5&country=ru`);
    const r = (d.results||[]).find(r => norm(r.trackName).includes(norm(t.title).slice(0,12))) || null;
    pvCache[k] = r && r.previewUrl ? r.previewUrl : null;
    if (r && r.artworkUrl100 && !t.cover) { t.cover = r.artworkUrl100.replace("100x100","200x200"); t.big = r.artworkUrl100.replace("100x100","600x600"); }
  } catch(e) { pvCache[k] = null; }
  return pvCache[k];
}
async function playChart(list, i){
  const items = list.map(t => ({...t, key:chKey(t), big:t.cover_url, preview:null, _chart:true}));
  playPreview(items[i], items, "Чарт");
}

// ---------- отрывки (без скачивания) ----------
async function playPreview(item, list, ctx){
  S.mode = "preview"; S.pv = item; S.pvList = list; S.ctx = ctx; const my = ++playToken;
  item.key = item.key || chKey(item);
  $("#nowTitle").textContent = item.title; $("#nowArtist").textContent = "Отрывок · " + item.artist;
  $("#nowCov").innerHTML = ph(item.artist) + (item.cover?`<img src="${esc(item.cover)}" onerror="this.remove()">`:"");
  updateNP(true);
  if (!item.preview) item.preview = await findPreview(item);
  if (my !== playToken) return;
  if (!item.preview) { toast(`«${item.title}» — отрывка нет, пропускаю`); return setTimeout(()=>stepPreview(1, true), 600); }
  audio.dataset.blob = ""; audio.src = item.preview; audio.play().catch(()=>{});
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title:item.title, artist:item.artist, artwork: item.cover?[{src:item.big||item.cover}]:[]});
  if (S.view==="chart") renderChart(); else if (S.view==="search" && $("#online")) { $("#online").innerHTML = onlineHtml(); bindOnline(); }
}
function stepPreview(d, auto){
  const L = S.pvList||[]; let i = L.findIndex(x=>x.key===S.pv.key);
  if (auto && d>0 && i===L.length-1) { setPlayIcon(false); return; }
  playPreview(L[(i+d+L.length)%L.length], L, S.ctx);
}

// ---------- страница трека («Сейчас играет») ----------
const bigCoverCache = {};
async function bigCover(t){
  if (!t.cover) return null;
  if (bigCoverCache[t.cover] !== undefined) return bigCoverCache[t.cover];
  try { bigCoverCache[t.cover] = await downloadHref(`_musichub/covers/${t.cover}.jpg`); } catch(e) { bigCoverCache[t.cover] = null; }
  return bigCoverCache[t.cover];
}
function npItem(){
  if (S.mode==="radio" && S.station) return {title:S.station.name, artist:"Радио · в эфире", small:S.station.favicon, big:S.station.favicon, ctx:"Радио", live:true};
  if (S.mode==="preview" && S.pv) return {title:S.pv.title, artist:S.pv.artist, small:S.pv.cover, big:S.pv.big||S.pv.cover_url||S.pv.cover, ctx:`${S.ctx||""} · отрывок 30 сек`, pv:S.pv};
  const t = S.byId[S.queue[S.qi]]; if (!t) return null;
  return {title:t.title, artist:t.artist, small:S.covers[t.cover]||"", track:t, ctx:S.ctx||"Библиотека"};
}
function openNP(){ if (!npItem()) return; $("#np").hidden = false; document.body.classList.add("np-open"); updateNP(true); }
function closeNP(){ $("#np").hidden = true; document.body.classList.remove("np-open"); }
let npShown = "";
async function updateNP(force){
  const np = $("#np"); if (!np || np.hidden) return; const it = npItem(); if (!it) return closeNP();
  const sig = it.title+"|"+it.artist+"|"+S.mode;
  if (force || sig !== npShown) {
    npShown = sig;
    $("#npCtx").textContent = it.ctx; $("#npTitle").textContent = it.title; $("#npArtist").textContent = it.artist;
    const setImg = src => { $("#npArt").innerHTML = ph(it.title) + (src?`<img src="${esc(src)}" onerror="this.remove()">`:""); $("#npBg").style.backgroundImage = src?`url("${src}")`:"none"; };
    setImg(it.big || it.small);
    if (it.track) { const b = await bigCover(it.track); if (b && npShown===sig) setImg(b); }
    $("#npLike").hidden = !it.track; if (it.track) $("#npLike").classList.toggle("on", likes.has(it.track.path));
    $("#npDl").hidden = !it.pv;
    $("#npShuffle").classList.toggle("on", S.shuffle); $("#npRepeat").classList.toggle("on", S.repeat>0);
    $("#npRepeat").dataset.one = S.repeat===2 ? "1" : "";
  }
  $("#npPlay").innerHTML = audio.paused ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  const live = S.mode==="radio", d = audio.duration||0, p = !live && d ? audio.currentTime/d*100 : (live?100:0);
  if (!npSeeking) { $("#npSeek").value = p*10; $("#npSeek").style.setProperty("--p", p+"%"); }
  $("#npCur").textContent = fmt(audio.currentTime); $("#npDur").textContent = live ? "LIVE" : "-"+fmt(Math.max(0,d-audio.currentTime));
}
let npSeeking = false;
function initNP(){
  $("#npClose").onclick = closeNP;
  $("#npPlay").onclick = () => { toggle(); };
  $("#npPrev").onclick = () => prev(); $("#npNext").onclick = () => next(false);
  $("#npShuffle").onclick = () => $("#bShuffle").click(); $("#npRepeat").onclick = () => $("#bRepeat").click();
  $("#npArtist").onclick = () => { const it = npItem(); if (it && it.track) { closeNP(); go("artist", it.track.artist); } };
  $("#npLike").onclick = () => { const it = npItem(); if (!it || !it.track) return; const p = it.track.path;
    likes.has(p) ? likes.delete(p) : likes.add(p); saveLikes(); $("#npLike").classList.toggle("on", likes.has(p)); toast(likes.has(p) ? "Добавлено в «Любимые»" : "Убрано из «Любимых»"); };
  $("#npDl").onclick = async () => { const it = npItem(); if (!it || !it.pv) return; const t = it.pv;
    const meta = {artist:t.artist, title:t.title, album:t.album||"", year:t.year||"", track:t.track||0, duration:t.duration||0, cover_url:t.cover_url||t.big||""};
    if (await sendRequest({kind:"track", meta}, `${t.artist} - ${t.title}`)) $("#npDl").hidden = true; };
  $("#npSeek").oninput = e => { npSeeking = true; e.target.style.setProperty("--p", e.target.value/10+"%"); };
  $("#npSeek").onchange = e => { if (S.mode!=="radio" && audio.duration) audio.currentTime = e.target.value/1000*audio.duration; npSeeking = false; };
  let y0 = null; const sheet = $("#npSheet");
  sheet.addEventListener("touchstart", e => { if (e.target.closest("input")) return; y0 = e.touches[0].clientY; }, {passive:true});
  sheet.addEventListener("touchmove", e => { if (y0===null) return; const dy = e.touches[0].clientY - y0; if (dy>0) sheet.style.transform = `translateY(${dy}px)`; }, {passive:true});
  sheet.addEventListener("touchend", e => { if (y0===null) return; const dy = (e.changedTouches[0].clientY - y0); sheet.style.transform = ""; y0 = null; if (dy > 110) closeNP(); });
  ["play","pause","timeupdate","durationchange"].forEach(ev => audio.addEventListener(ev, () => updateNP()));
}
initNP();

// ---------- плеер ----------
function ctxName(){ return S.view==="artist" ? S.arg : S.view==="playlist" ? `Плейлист «${S.arg}»` : S.view==="search" ? "Поиск" : "Все треки"; }
function playList(list, i){
  S.ctx = ctxName();
  let ids = list.map(t=>t.id);
  if (S.shuffle) { const first = ids[i]; ids = ids.filter(x=>x!==first).sort(()=>Math.random()-.5); ids.unshift(first); i = 0; }
  S.queue = ids; S.qi = i; playCurrent();
}
// iOS Safari разрешает звук только «по нажатию». Пока мы ждём ссылку на файл от Яндекс Диска, нажатие
// «протухает» — поэтому при первом касании «разблокируем» плеер тихим звуком.
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
let unlocked = false;
function unlockAudio(){
  if (unlocked) return; unlocked = true;
  if (!audio.src || audio.src === SILENT) { audio.src = SILENT; audio.play().then(()=>{ if (audio.src===SILENT) audio.pause(); }).catch(()=>{ unlocked = false; }); }
}
["touchend","click","keydown"].forEach(ev => document.addEventListener(ev, unlockAudio, {capture:true}));
const isSilent = () => audio.src === SILENT;
let playToken = 0;
// Яндекс Диск отдаёт файлы «как вложение», и Safari на iPhone не всегда играет их по прямой ссылке.
// Поэтому при сбое скачиваем трек в память и играем оттуда (заодно заранее готовим следующий).
const MIME = {mp3:"audio/mpeg", m4a:"audio/mp4", mp4:"audio/mp4", aac:"audio/aac", flac:"audio/flac", wav:"audio/wav", ogg:"audio/ogg", opus:"audio/ogg"};
const blobCache = new Map();   // path -> objectURL (держим последние несколько)
const S2 = { useBlob: ls.get("useBlob2")==="1" };
async function blobUrl(path){
  if (blobCache.has(path)) return blobCache.get(path);
  const href = await downloadHref(path);
  const r = await fetch(href, {referrerPolicy:"no-referrer"}); if (!r.ok) throw new Error("скачивание "+r.status);
  const ext = (path.split(".").pop()||"").toLowerCase();
  const url = URL.createObjectURL(new Blob([await r.arrayBuffer()], {type: MIME[ext] || "audio/mpeg"}));
  blobCache.set(path, url);
  while (blobCache.size > 4) { const [k,v] = blobCache.entries().next().value; URL.revokeObjectURL(v); blobCache.delete(k); }
  return url;
}
async function playCurrent(viaBlob){
  const t = S.byId[S.queue[S.qi]]; if (!t) return;
  S.mode = "track"; const my = ++playToken;
  const blob = viaBlob || S2.useBlob;
  $("#nowTitle").textContent = t.title; $("#nowArtist").textContent = blob && !blobCache.has(t.path) ? "Загружаю…" : t.artist; $("#nowCov").innerHTML = coverHtml(t);
  document.querySelectorAll(".row").forEach(r => r.classList.remove("playing"));
  try {
    const src = blob ? await blobUrl(t.path) : await downloadHref(t.path);
    if (my !== playToken) return;
    audio.dataset.blob = blob ? "1" : ""; audio.src = src;
    $("#nowArtist").textContent = t.artist;
    await audio.play().catch(err => { if (err && err.name==="NotAllowedError") toast("Нажмите ▶ ещё раз"); });
  } catch(e) { $("#nowArtist").textContent = t.artist; toast("Не удалось открыть файл: "+e.message); return; }
  if ("mediaSession" in navigator) {
    const art = S.covers[t.cover]; navigator.mediaSession.metadata = new MediaMetadata({title:t.title, artist:t.artist, album:t.album, artwork: art?[{src:art, sizes:"160x160", type:"image/jpeg"}]:[]});
  }
  if (["library","artist","playlist"].includes(S.view)) render();
  if (S.view==="chart") renderChart();
  updateNP(true);
  const nxt = S.queue[S.qi+1];
  if (nxt) (blob ? blobUrl(S.byId[nxt].path) : downloadHref(S.byId[nxt].path)).catch(()=>{});   // заранее готовим следующий трек
}
function next(auto){
  if (S.mode==="radio") { if (!auto) stepStation(1); return; }
  if (S.mode==="preview") return stepPreview(1, auto);
  if (!S.queue.length) return;
  if (auto && S.repeat===2) { audio.currentTime=0; audio.play(); return; }
  if (S.qi < S.queue.length-1) S.qi++; else if (S.repeat===1 || !auto) S.qi = 0; else { setPlayIcon(false); return; }
  playCurrent();
}
function prev(){ if (S.mode==="radio") return stepStation(-1); if (S.mode==="preview") return stepPreview(-1); if (audio.currentTime > 3 || S.qi<=0) { audio.currentTime = 0; return; } S.qi--; playCurrent(); }
function toggle(){
  if (S.mode==="radio" && audio.paused && S.station) { audio.src = S.station.url; audio.play(); return; }
  if (!audio.src || isSilent()) { if (S.queue.length && S.qi>=0) playCurrent(); else if (S.tracks.length) playList(S.tracks, 0); return; }
  audio.paused ? audio.play() : audio.pause();
}
function setPlayIcon(p){ $("#icoPlay").innerHTML = p ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>'; }
$("#bPlay").onclick = toggle; $("#bNext").onclick = () => next(false); $("#bPrev").onclick = prev;
$("#bShuffle").onclick = e => { S.shuffle=!S.shuffle; e.currentTarget.classList.toggle("on",S.shuffle); toast(S.shuffle?"Перемешивание включено":"Перемешивание выключено"); };
$("#bRepeat").onclick = e => { S.repeat=(S.repeat+1)%3; e.currentTarget.classList.toggle("on",S.repeat>0); toast(["Повтор выключен","Повтор списка","Повтор трека"][S.repeat]); };
audio.onplay = () => { if (isSilent()) return; setPlayIcon(true); if ("mediaSession" in navigator) navigator.mediaSession.playbackState="playing"; };
audio.onpause = () => { setPlayIcon(false); if ("mediaSession" in navigator) navigator.mediaSession.playbackState="paused"; };
audio.onended = () => { if (!isSilent()) next(true); };
audio.onerror = () => {
  if (isSilent() || !audio.src) return;
  if (S.mode==="radio") { toast("Станция сейчас не отвечает"); return; }
  if (S.mode==="preview") { toast("Отрывок не загрузился — следующий"); return setTimeout(()=>stepPreview(1,true), 800); }
  const t = S.byId[S.queue[S.qi]]; if (t) { delete hrefCache[t.path]; }   // ссылка могла устареть — берём новую
  if (!audio.dataset.blob) {   // прямая ссылка не играет — переходим на скачивание в память
    S2.useBlob = true; ls.set("useBlob2","1"); playCurrent(true); return;
  }
  const code = audio.error ? audio.error.code : "?";
  const ext = t ? (t.path.split(".").pop()||"").toLowerCase() : "";
  toast(code===4 && ["ogg","opus","flac"].includes(ext) ? `Формат .${ext} этот браузер не играет — пропускаю` : `Файл не воспроизводится (код ${code}) — пропускаю`);
  setTimeout(()=>next(true), 1500);
};
audio.onplaying = () => { audio.dataset.retried = ""; };
let seeking=false;
audio.ontimeupdate = () => {
  if (S.mode==="radio") { $("#tCur").textContent=fmt(audio.currentTime); $("#seek").value=1000; $("#seek").style.setProperty("--p","100%"); $("#mprog").style.setProperty("--p","100%"); return; }
  const d = audio.duration||0, p = d ? audio.currentTime/d*100 : 0;
  if (!seeking) { $("#seek").value=p*10; $("#seek").style.setProperty("--p",p+"%"); }
  $("#mprog").style.setProperty("--p",p+"%"); $("#tCur").textContent=fmt(audio.currentTime); $("#tDur").textContent=fmt(d);
};
$("#seek").oninput = e => { seeking=true; e.target.style.setProperty("--p", e.target.value/10+"%"); };
$("#seek").onchange = e => { if (S.mode!=="radio" && audio.duration) audio.currentTime = e.target.value/1000*audio.duration; seeking=false; };
const setVol = v => { audio.volume=v/100; $("#vol").style.setProperty("--p",v+"%"); ls.set("vol",v); };
$("#vol").value = +(ls.get("vol")||90); $("#vol").oninput = e => setVol(+e.target.value); setVol(+$("#vol").value);
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack", () => next(false));
  navigator.mediaSession.setActionHandler("previoustrack", prev);
  try { navigator.mediaSession.setActionHandler("seekto", d => audio.currentTime = d.seekTime); } catch(e){}
}
document.addEventListener("keydown", e => { if (e.target.matches("input")) return; if (e.code==="Space") { e.preventDefault(); toggle(); } });
$("#now").onclick = () => openNP();

render();
boot().then(() => { if (D.token) { loadLibrary(); pollJobs(); } });

}
</script>

</body>
</html>
